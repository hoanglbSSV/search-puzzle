<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bé tìm chữ cái</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sun:#FFD93B; --sun-ink:#3B2A00; --bg:#E8F6FF; --bg2:#FFF6D6; --tile:#FFFFFF; --ink:#1F2A5A;
  --coral:#FF5A4F; --mint:#2BB673; --sky:#3AA0FF; --grape:#9B6BFF; --honey:#FFB020;
  --panel:#FFFFFF; --shadow:rgba(31,42,90,.18);
  --font:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17204A;--bg2:#222C5E;--tile:#2C3872;--ink:#FFF7E0;--panel:#2C3872;--shadow:rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#17204A;--bg2:#222C5E;--tile:#2C3872;--ink:#FFF7E0;--panel:#2C3872;--shadow:rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;overflow-x:clip;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;font-family:var(--font);color:var(--ink);background:radial-gradient(circle at 12% 88%,var(--bg2) 0 18%,transparent 19%),radial-gradient(circle at 92% 70%,var(--bg2) 0 12%,transparent 13%),var(--bg);user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sun);z-index:10}
.top{background:var(--sun);color:var(--sun-ink);border-bottom:6px solid var(--honey);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px clamp(10px,3vw,28px)}
.lv{justify-self:start;width:clamp(44px,8vw,64px);aspect-ratio:1;border-radius:50%;background:#fff;border:5px solid var(--coral);display:grid;place-items:center;font-weight:800;font-size:clamp(1.3rem,3.6vw,2rem);box-shadow:0 4px 0 var(--shadow);color:var(--sun-ink)}
h1{margin:0;font-size:clamp(1.3rem,4.4vw,2.7rem);font-weight:800;display:flex;align-items:center;gap:.35em;white-space:nowrap}
h1 b{display:grid;place-items:center;min-width:1.5em;height:1.5em;padding:0 .15em;border-radius:.6em;background:var(--coral);color:#fff;box-shadow:0 4px 0 #C93A31;font-size:1.05em;line-height:1}
.right{justify-self:end;display:flex;align-items:center;gap:clamp(6px,2vw,18px)}
.clock{position:relative;width:clamp(46px,8vw,66px);aspect-ratio:1}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock circle{fill:#fff;stroke-width:9}
.clock .bg{stroke:#FFE9A0}
.clock .fg{fill:none;stroke:var(--coral);stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:0}
.clock span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:clamp(1.1rem,3vw,1.7rem);color:#1F2A5A}
.clock.run .fg{animation:ring 15s linear forwards}
@keyframes ring{to{stroke-dashoffset:283}}
.star{font-size:clamp(1.8rem,5vw,3rem);color:var(--coral);filter:drop-shadow(0 3px 0 var(--shadow));transition:transform .4s}
.won .star{color:var(--honey);animation:pop .7s ease-out 2}
@keyframes pop{50%{transform:scale(1.6) rotate(20deg)}}
main{flex:1;display:flex;flex-direction:column;width:100%;max-width:1160px;margin:0 auto;padding:clamp(10px,2vw,24px) clamp(16px,4vw,56px) clamp(12px,2vw,26px)}
.say{display:flex;align-items:center;justify-content:center;gap:12px;height:clamp(72px,11vw,100px);margin:0 auto clamp(10px,2vw,20px);padding:0 22px 0 12px;border:5px solid transparent;width:fit-content;max-width:100%;background:var(--panel);border-radius:999px;box-shadow:0 5px 0 var(--shadow);font-weight:700;font-size:clamp(1rem,2.9vw,1.7rem);text-align:center;line-height:1.2}
.say i{font-style:normal;font-size:1.9em;line-height:1}
.say em.tl{font-style:normal;font-weight:800;font-size:2.3em;line-height:.9;color:var(--coral);margin:0 .12em;display:inline-block;vertical-align:middle;text-shadow:0 3px 0 rgba(255,90,79,.25)}
.say.win{border-color:var(--honey);background:#fff;color:#B25A00;font-weight:800;font-size:clamp(1.15rem,3.6vw,2.2rem);animation:pop2 .6s ease-out}
.say.win i{animation:wob 1s ease-in-out infinite}
@keyframes pop2{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes wob{50%{transform:rotate(-14deg) scale(1.12)}}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:clamp(10px,2.4vw,34px);position:relative}
.t{--c:var(--sky);appearance:none;border:0;cursor:pointer;aspect-ratio:1;border-radius:26%;background:var(--tile);color:var(--ink);font:700 clamp(1.7rem,5.6vw,4.4rem)/1 var(--font);box-shadow:0 clamp(4px,.9vw,8px) 0 var(--c);padding:0 0 .08em;transition:transform .12s,box-shadow .12s,opacity .3s}
.t:nth-child(4n+2){--c:var(--coral)}.t:nth-child(4n+3){--c:var(--mint)}.t:nth-child(4n){--c:var(--grape)}.t:nth-child(4n+1){--c:var(--sky)}
.t:hover{transform:translateY(-3px)}
.t:active{transform:translateY(5px);box-shadow:0 0 0 var(--c)}
.t:focus-visible{outline:4px solid var(--coral);outline-offset:3px}
.t.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-9px) rotate(-5deg)}40%,80%{transform:translateX(9px) rotate(5deg)}}
.done .t{cursor:default;opacity:.35;transform:none;box-shadow:0 4px 0 var(--c)}
.done .t.ok{opacity:1;border-radius:50%;outline:6px solid var(--coral);outline-offset:3px;background:#fff;color:var(--coral);transform:scale(1.12);position:relative;z-index:2;animation:pop2 .6s ease-out}
.foot{min-height:clamp(80px,9vw,88px);display:flex;justify-content:center;align-items:center;gap:clamp(10px,3vw,28px);flex-wrap:wrap;margin-top:clamp(14px,3vw,26px);font-weight:700;color:var(--ink);opacity:.8;font-size:clamp(.85rem,2.2vw,1.2rem);text-align:center}
.btn{font:800 clamp(1rem,2.8vw,1.5rem)/1 var(--font);padding:.7em 1.4em;border:0;border-radius:999px;cursor:pointer;color:#fff;box-shadow:0 6px 0 var(--d);background:var(--b);opacity:1}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d)}
.btn:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.again{--b:var(--mint);--d:#1B8A53}.next{--b:var(--sky);--d:#1F72C4}
body{padding-bottom:76px}
.btn.first{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:12;--b:var(--grape);--d:#6B3FD1;font-size:clamp(.85rem,2vw,1.15rem);padding:.65em 1.2em}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:.7em 1.3em;border-radius:999px;font-weight:700;font-size:clamp(1rem,3vw,1.5rem);opacity:0;pointer-events:none;transition:.25s;z-index:20;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
:root{--cur-main:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' viewBox='0 0 56 56'><line x1='35' y1='35' x2='50' y2='50' stroke='%231F2A5A' stroke-width='11' stroke-linecap='round'/><line x1='35' y1='35' x2='50' y2='50' stroke='%23FF5A4F' stroke-width='6' stroke-linecap='round'/><circle cx='22' cy='22' r='17' fill='%23D8F3FF' stroke='%231F2A5A' stroke-width='4'/><circle cx='16' cy='19' r='2.8' fill='%231F2A5A'/><circle cx='28' cy='19' r='2.8' fill='%231F2A5A'/><path d='M14 27Q22 35 30 27' fill='none' stroke='%231F2A5A' stroke-width='3' stroke-linecap='round'/></svg>") 22 22,auto;--cur-hand:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='64' viewBox='0 0 56 64'><g fill='%23fff' stroke='%231F2A5A' stroke-width='4' stroke-linejoin='round'><rect x='19' y='3' width='13' height='34' rx='6.5'/><circle cx='11' cy='40' r='8'/><rect x='11' y='28' width='36' height='28' rx='12'/></g><g fill='%23fff'><rect x='21' y='7' width='9' height='34' rx='4.5'/><rect x='13' y='30' width='32' height='24' rx='10'/></g><rect x='15' y='54' width='28' height='8' rx='3' fill='%23FF5A4F' stroke='%231F2A5A' stroke-width='3'/></svg>") 25 4,pointer}
body,main,.top{cursor:var(--cur-main)}
.t,.btn{cursor:var(--cur-hand)}
.done .t{cursor:var(--cur-main)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
@media (max-width:640px){.grid{flex:none;grid-template-columns:repeat(6,1fr);grid-template-rows:none;gap:10px}.t{aspect-ratio:1;font-size:clamp(1.8rem,10vw,3.4rem)}.top{grid-template-columns:auto 1fr auto}.top h1{justify-self:center}.star{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

<header class="top">
  <div class="lv" id="lv">1</div>

  <div class="right"><div class="clock" id="clock"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45"/><circle class="fg" cx="50" cy="50" r="45"/></svg><span id="sec">15</span></div><div class="star" id="star">★</div></div>
</header>
<main id="m">
  <div class="say" id="say"></div>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot"></div>
</main>
<div class="toast" id="toast" role="status">Chưa đúng, con thử lại nhé!</div>

function burst(x,y){var h=Math.random()*360,n=44;for(var i=0;i<n;i++){var a=Math.PI*2*i/n,s=2+Math.random()*4.5;ps.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:"hsl("+(h+Math.random()*50)+",95%,60%)"})}}
function fireworks(ms){
  cancelAnimationFrame(raf);endT=Date.now()+ms;nextB=0;
  (function loop(){
    var now=Date.now();cx.clearRect(0,0,cv.width,cv.height);
    if(now<endT&&now>nextB){burst(cv.width*(.15+Math.random()*.7),cv.height*(.15+Math.random()*.4));nextB=now+420}
    ps=ps.filter(function(p){return p.l>0});
    ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l-=.013;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,3.2,0,7);cx.fill()});
    cx.globalAlpha=1;
    if(now<endT||ps.length)raf=requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height);
  })();
}
$("first").onclick=function(){endT=0;ps=[];lv=0;start()};
start();
</script>
